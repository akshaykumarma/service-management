<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shubha Sewing — UI Concept</title><style>
:root{--paper:#faf9f6;--ink:#242522;--muted:#696a63;--line:#dedfd8;--red:#bd281b;--sand:#eeebe4}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 Arial,sans-serif}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:5px}button{cursor:pointer}header{height:100px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 6%;background:var(--paper)}.logo{width:145px;height:74px;object-fit:contain}nav{display:flex;gap:32px;align-items:center}nav a{font-size:14px}nav a.active{color:var(--red)}.tools{display:flex;gap:24px;align-items:center}.bag{border:1px solid var(--line);background:none;padding:7px 15px;border-radius:24px}main{min-height:65vh}.wrap{max-width:1320px;margin:auto;padding:64px 6%}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2.5px;color:var(--muted);margin-bottom:20px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(44px,5vw,76px);line-height:1.05;font-weight:400;letter-spacing:-3px;margin-bottom:26px}h2{font-size:36px;line-height:1.2;font-weight:400;letter-spacing:-1.2px}h3{font-size:19px;font-weight:500}p{color:var(--muted);max-width:530px}.serif{font-family:Georgia,serif;font-style:italic;color:var(--red)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:24px;background:var(--ink);color:white;border:1px solid var(--ink);padding:13px 24px;font-size:13px}.btn:hover{background:var(--red);border-color:var(--red)}.btn.secondary{background:transparent;color:var(--ink);border-color:var(--line)}.hero{position:relative;min-height:630px;display:flex;align-items:center;background:#e8e0d5;overflow:hidden}.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(249,246,240,.95),rgba(249,246,240,.72) 32%,transparent 61%)}.hero-copy{position:relative;z-index:1;padding:70px 6%;max-width:610px}.hero-copy p{max-width:330px;margin-bottom:30px}.hero-note{margin-top:28px;font-size:11px;letter-spacing:1px}.row{display:flex;align-items:center;justify-content:space-between;gap:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.category{padding:25px 0;border-top:1px solid var(--line)}.category span{display:block;color:var(--muted);font-size:12px;margin-bottom:15px}.category:hover h3{color:var(--red)}.band{background:var(--sand)}.split{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}.editorial{width:100%;aspect-ratio:1.1;object-fit:cover}.textlink{border-bottom:1px solid var(--ink);padding-bottom:5px;font-size:13px}.pagehead{padding-bottom:35px}.pagehead h1{font-size:56px}.catalogue{display:grid;grid-template-columns:200px 1fr;gap:44px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:30px 20px}.product-image{aspect-ratio:1;background:#f0efea;display:flex;align-items:center;justify-content:center;overflow:hidden}.product-image img{width:90%;height:90%;object-fit:contain;mix-blend-mode:multiply}.product h3{margin:13px 0 0;font-size:16px}.product p{font-size:12px;margin-bottom:10px}.product button{background:transparent;border:0;border-bottom:1px solid var(--line);padding:5px 0;font-size:12px}.product .row{gap:10px;align-items:baseline}.price{font-size:14px}.filter-title{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px}.filter{display:block;border:0;background:none;padding:8px 0;text-align:left;color:var(--muted);font-size:13px}.filter.active{color:var(--red)}.toolbar{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:15px 0;margin-bottom:30px}.toolbar input{border:0;background:transparent;width:55%;padding:8px 0}.toolbar select{border:0;background:transparent;font-size:12px;max-width:42%}.service-card{border-top:1px solid var(--line);padding:26px 0}.service-card .num{font-family:Georgia,serif;color:var(--red);font-size:25px;margin-bottom:28px}.three{grid-template-columns:repeat(3,1fr)}label{display:block;font-size:12px;margin-bottom:17px}input,select,textarea{display:block;width:100%;background:transparent;border:1px solid #babcb4;padding:12px;margin-top:7px;border-radius:0}textarea{min-height:105px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}details{padding:20px 0;border-top:1px solid var(--line)}summary{cursor:pointer}details p{margin-top:16px;font-size:14px}.signin{display:grid;grid-template-columns:1fr 1fr;min-height:700px}.signin-image{background:url('assets/hero.png') center/cover;position:relative}.signin-image .quote{position:absolute;bottom:36px;left:40px;background:rgba(250,249,246,.93);padding:28px;max-width:340px;font:30px/1.2 Georgia,serif}.signin-form{max-width:370px;width:100%;margin:auto;padding:60px 20px}.signin-form h1{font-size:42px;letter-spacing:-1.5px}.signin-form .btn{width:100%}.password{position:relative}.password input{padding-right:65px}.password button{position:absolute;right:12px;top:11px;border:0;background:none;font-size:12px}.signin-form .small{font-size:12px}.signin-form .row{margin-bottom:24px}footer{border-top:1px solid var(--line);padding:45px 6% 22px}.footer-top{display:flex;justify-content:space-between;gap:30px;padding-bottom:35px}.footer-top p{font-size:13px;max-width:280px}.footer-links{display:flex;gap:32px;font-size:13px}.footnote{border-top:1px solid var(--line);padding-top:18px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:15px 25px;z-index:5;max-width:90%;font-size:13px}.hide{display:none}.about-mark{font:italic 90px/1 Georgia,serif;color:var(--red);padding:75px 20px;border:1px solid var(--line);text-align:center}.empty{padding:50px 0;color:var(--muted)}@media(min-width:1450px){.hero-copy{padding-left:calc((100vw - 1260px)/2)}}@media(max-width:800px){header{height:auto;min-height:88px;flex-wrap:wrap;padding:10px 5%;gap:8px}.logo{width:110px;height:56px}nav{order:3;width:100%;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:10px 0}nav a{font-size:12px}.tools{font-size:12px;gap:12px}.hero{min-height:660px;align-items:flex-start}.hero>img{height:55%;top:auto;bottom:0;object-position:65% center}.hero:after{background:linear-gradient(#f4eee5 0%,#f4eee5 44%,transparent 64%)}.hero-copy{padding:40px 6%}.hero-copy h1{font-size:47px;letter-spacing:-2px}.hero-copy p{font-size:14px;margin-bottom:20px}.hero-note{display:none}.wrap{padding:40px 6%}.grid{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr;gap:30px}.catalogue{grid-template-columns:1fr;gap:20px}.catalogue aside{display:flex;gap:16px;overflow-x:auto;white-space:nowrap}.catalogue aside .filter-title{display:none}.products{grid-template-columns:1fr 1fr;gap:22px 14px}.product .row{display:block}.pagehead h1{font-size:43px;letter-spacing:-2px}h2{font-size:30px}.three{grid-template-columns:1fr}.signin{grid-template-columns:1fr}.signin-image{display:none}.signin-form{padding:60px 24px}.footer-top{flex-direction:column}.footer-links{flex-wrap:wrap;gap:20px}.footnote{gap:20px}.formgrid{grid-template-columns:1fr}.row h2{font-size:28px}.row .textlink{white-space:nowrap}.about-mark{font-size:64px}}
</style><link rel="stylesheet" href="assets/videos.css"><link rel="stylesheet" href="assets/refinement.css"><link rel="stylesheet" href="assets/reference-layout.css"></head><body><header><a href="#home" aria-label="Shubha Sewing home"><img class="logo" src="assets/logo.png" alt="Shubha Sewing"></a><nav aria-label="Main navigation"><a href="#home">Home</a><a href="#shop">Shop</a><a href="#service">Service</a><a href="#about">About</a></nav><div class="tools"><a href="#signin">Sign in</a><button class="bag" id="bag" aria-label="Shopping cart">Cart <span id="count">0</span></button></div></header><main id="app"></main><footer><div class="footer-top"><div><strong>Made for your next creation.</strong><p>Sewing machines, embroidery machines and accessories.</p></div><div class="footer-links"><a href="#shop">Explore the shop</a><a href="#service">Service & support</a><a href="#about">Our story</a></div></div><div class="footnote"><span>Shubha Sewing · Bengaluru</span><span>UI concept / September 2026</span></div></footer><div id="notice" class="notice hide" role="status"></div><script src="assets/reference-layout.js"></script><script src="assets/videos-data.js"></script><script src="assets/videos.js"></script><script>
const app=document.querySelector('#app');let category='All products',query='',sort='featured',bag=0;
const items=[['JA1400','Home Sewing','Brother',18900,'https://clusterzap1.blob.core.windows.net/18-jxcwd9se/Brother/HSM-JA1400.jpg'],['GS 1700','Home Sewing','Brother',22900,'https://clusterzap1.blob.core.windows.net/18-jxcwd9se/Brother/HSM-GS1700.jpg'],['LX27NT','Home Sewing','Brother',28500,'https://clusterzap1.blob.core.windows.net/18-jxcwd9se/Brother/HSM-LX27NT.jpg'],['EM-1010','Embroidery','Ricoma',325000,'https://clusterzap1.blob.core.windows.net/18-jxcwd9se/NewSewingImg/em1010.jpg'],['Q5','Industrial','Bruce',32000,'https://clusterzap1.blob.core.windows.net/18-jxcwd9se/NewSewingImg/Q5.jpg'],['Universal needles','Accessories','Schmetz',250,'https://clusterzap1.blob.core.windows.net/18-jxcwd9se/Schmetz/1.-Universal-Needle.jpg']];
items.push(['JA – 20','Home Sewing','Brother',17500,'https://clusterzap1.blob.core.windows.net/18-jxcwd9se/NewSewingImg/Ja20.jpg'],['TC-8S Series','Embroidery','Ricoma',345000,'https://clusterzap1.blob.core.windows.net/18-jxcwd9se/Ricoma/Ricoma-8S-Series.jpg']);
const categories=['All products','Home Sewing','Industrial','Embroidery','Accessories'];
function toast(t){let n=document.querySelector('#notice');n.textContent=t;n.classList.remove('hide');clearTimeout(window.nt);window.nt=setTimeout(()=>n.classList.add('hide'),4000)}
function card(i){return referenceCard(i)}
function add(){document.querySelector('#count').textContent=++bag;toast('Added to your concept cart. Checkout is outside this five-page prototype.')}
const home=()=>referenceHome();
function shop(){return referenceShop()}
function list(){let result=items.filter(i=>(category==='All products'||i[1]===category)&&i.join(' ').toLowerCase().includes(query.toLowerCase()));if(sort!=='featured')result.sort((a,b)=>sort==='low'?a[3]-b[3]:b[3]-a[3]);document.querySelector('#results').textContent=result.length+(result.length===1?' product':' products');document.querySelector('#products').innerHTML=result.length?result.map(card).join(''):'<p class="empty">No matching products. Try another search or category.</p>'}
const service=()=>`<section class="wrap"><div class="pagehead"><div class="eyebrow">Service & support</div><h1>Keep your creativity<br><span class="serif">moving.</span></h1><p>Tell us what your machine needs. We’ll help you find the next step.</p><a class="btn" href="#request">Request assistance ↗</a></div><div class="grid three">${[['01','Machine care','Ask about maintenance and care for your machine.'],['02','Troubleshooting','Share the issue and your model details with our team.'],['03','Choosing a machine','Find a starting point for your projects and requirements.']].map(x=>`<div class="service-card"><div class="num">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div></section><section class="band" id="request"><div class="wrap split"><div><div class="eyebrow">Let’s start with the details</div><h2>How can we help?</h2><p>Have your machine’s brand and model handy. A few details will help explain what you need.</p></div><form id="serviceform"><div class="formgrid"><label>Your name<input required autocomplete="name"></label><label>Email address<input type="email" required autocomplete="email"></label><label>Machine / model<input placeholder="e.g. Brother JA1400"></label><label>Help with<select><option>Machine service</option><option>Troubleshooting</option><option>Choosing a machine</option></select></label></div><label>Tell us more<textarea required placeholder="Describe your question or the issue"></textarea></label><button class="btn">Request assistance ↗</button></form></div></section>`;
const about=()=>`<section class="wrap split"><div><div class="eyebrow">About Shubha</div><h1>A place for<br>people who<br><span class="serif">make.</span></h1><p>Sewing connects an idea to something you can hold. Shubha brings machines and accessories together for that journey.</p></div><img class="editorial" src="assets/hero.png" alt="Embroidery in progress"></section><section class="band"><div class="wrap split"><div class="eyebrow">Our story</div><div><h2>Rooted in Bengaluru.<br>Inspired by your craft.</h2><p>Shubha Sewing brings sewing machines and accessories to homes and businesses across Bengaluru and Karnataka.</p><p>Explore machines for home sewing, industrial work and embroidery, alongside accessories for your next project.</p><a href="#shop" class="textlink">Discover the collection ↗</a></div></div></section><section class="wrap"><div class="row"><h2>Let’s meet in person.</h2><span class="eyebrow">Bengaluru</span></div><div class="grid"><div class="category"><h3>Balepet</h3><p>Head office</p></div><div class="category"><h3>Hanumanth Nagar</h3><p>Showroom</p></div><div class="category"><h3>Madiwala</h3><p>Showroom</p></div><div class="category"><h3>Hebbal</h3><p>Showroom</p></div></div></section>`;
const signin=()=>`<section class="signin"><div class="signin-image"><div class="quote">Make room for<br><em>your next idea.</em></div></div><div class="signin-form"><div class="eyebrow">Your Shubha account</div><h1>Welcome back.</h1><p>Sign in to keep your orders close.</p><form id="login"><label>Email address<input type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<div class="password"><input id="password" type="password" required autocomplete="current-password"><button type="button" id="show">Show</button></div></label><div class="row"><span></span><button class="filter" type="button" onclick="toast('Password recovery is a proposed linked screen for development.')">Forgot password?</button></div><button class="btn">Sign in ↗</button></form><p class="small" style="margin-top:25px">New to Shubha? <button class="filter" style="display:inline;color:var(--red)" onclick="toast('Account creation is a proposed linked screen for development.')">Create an account</button></p><a href="#shop" class="textlink">Continue browsing ↗</a></div></section>`;
function render(){let page=location.hash.slice(1)||'home';if(page==='request'){document.querySelector('#request')?.scrollIntoView({behavior:'smooth'});return}if(!['home','shop','service','about','signin'].includes(page))page='home';app.innerHTML=({home,shop,service,about,signin}[page])();document.title=page[0].toUpperCase()+page.slice(1)+' — Shubha Sewing';document.querySelectorAll('nav a').forEach(a=>{a.classList.toggle('active',a.hash==='#'+page);if(a.hash==='#'+page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(page==='shop'){let s=document.querySelector('#search');s.value=query;s.oninput=()=>{query=s.value;list()};let t=document.querySelector('#sort');t.value=sort;t.onchange=()=>{sort=t.value;list()};list()}if(page==='service')document.querySelector('#serviceform').onsubmit=e=>{e.preventDefault();toast('Preview complete. No service request has been sent.')};if(page==='signin'){document.querySelector('#login').onsubmit=e=>{e.preventDefault();toast('Design preview only. No credentials are transmitted or saved.')};document.querySelector('#show').onclick=()=>{let p=document.querySelector('#password');p.type=p.type==='password'?'text':'password';document.querySelector('#show').textContent=p.type==='password'?'Show':'Hide'}}window.scrollTo(0,0)}window.onhashchange=render;document.querySelector('#bag').onclick=()=>toast(bag?bag+' item(s) in your concept cart. Cart and checkout are outside this prototype.':'Your cart is empty. Explore the shop to add an item.');render();
</script></body></html>
